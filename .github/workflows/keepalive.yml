name: Garder Supabase éveillé

# Supabase met en pause les projets gratuits après 7 jours sans activité.
# Cette tâche gratuite "fait signe" à la base tous les 3 jours.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' config.js)
          KEY=$(grep -oP 'SUPABASE_KEY:\s*"\K[^"]+' config.js)
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo
          # Petit commit mensuel pour que GitHub ne désactive pas cette tâche (désactivée après 60 jours sans activité)
          if [ "$(date +%d)" -le 03 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
            git config user.name "keepalive"
            git config user.email "keepalive@users.noreply.github.com"
            git add .keepalive && git commit -m "keepalive" && git push || true
          fi
    permissions:
      contents: write
