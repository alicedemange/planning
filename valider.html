<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validation d'un post · Cha'Mania</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="👀 Un post Cha'Mania attend ta validation">
<meta property="og:description" content="Regarde le visuel et le texte, puis valide ou demande une modification en un clic.">
<meta name="theme-color" content="#f75b95">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Page de validation : une colonne, pensée pour être ouverte depuis Messenger sur téléphone */
:root{
  --rose:#f75b95; --rose-deep:#d93d78; --rose-pale:#f1b4cb; --rose-wash:#fdecf3;
  --turq:#31bbbb; --turq-deep:#1f8f8f; --turq-wash:#e7f4f4;
  --creme:#fffcf7; --paper:#fff; --ink:#1f1a1d; --muted:#6e666b; --line:#eee2e6;
  --ok:#1e9466; --ok-wash:#e5f5ee; --warn-wash:#fff6dc; --late:#d63c3c;
  --display:"Chewy","Comic Sans MS",cursive; --body:"Roboto Condensed","Arial Narrow",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--creme);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--turq);outline-offset:2px;border-radius:6px}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;gap:10px}
header svg{width:40px;height:40px}
header h1{font-family:var(--display);font-weight:400;color:var(--rose);font-size:28px;margin:0;line-height:1}
header small{display:block;color:var(--muted);font-size:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(80,30,50,.06),0 4px 14px rgba(80,30,50,.06)}
h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 6px;line-height:1.1;text-wrap:balance}
.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:15px}
.meta b{color:var(--ink)}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px}
.gallery figure{margin:0;flex:0 0 88%;scroll-snap-align:center;border-radius:14px;overflow:hidden;background:var(--rose-wash);aspect-ratio:4/5}
.gallery figure:only-child{flex-basis:100%}
.gallery img,.gallery video{width:100%;height:100%;object-fit:cover;display:block}
.count{font-size:13px;color:var(--muted);text-align:center;margin-top:6px}
.caption{white-space:pre-wrap}
.tags{color:var(--turq-deep);font-weight:500;margin-top:10px}
.banner{border-radius:14px;padding:12px 14px;background:var(--turq-wash);border:1px solid #acd1d1}
.banner.ok{background:var(--ok-wash);border-color:#bfe3d2}
.banner.warn{background:var(--warn-wash);border-color:#f0dc9c}
.appr{font-size:15px;padding:6px 0;border-top:1px solid var(--line)}
.appr:first-child{border-top:0}
.appr small{color:var(--muted);display:block;font-size:13px}
.who{display:flex;gap:8px;flex-wrap:wrap}
.who button{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.who button[aria-pressed="true"]{border-color:var(--rose);background:var(--rose-wash)}
.who input{border:2px solid var(--line);border-radius:999px;padding:8px 14px;min-width:0;flex:1}
label{font-weight:700;font-size:15px;display:block;margin-bottom:6px}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);resize:vertical}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:14px;padding:16px 12px;font-weight:700;font-size:18px;cursor:pointer}
.btn.ok{background:var(--ok);color:#fff}
.btn.ko{background:var(--paper);border:2px solid var(--rose);color:var(--rose-deep)}
.btn[disabled]{opacity:.5;cursor:default}
.err{color:var(--late);font-weight:500}
.done{text-align:center;padding:30px 16px}
.done .big{font-size:56px}
.hint{color:var(--muted);font-size:14px}
.sec-t{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:700}
</style>
</head>
<body>
<main id="app">
  <header>
    <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 35 C8 26 3 19 3 12.5 C3 7.5 7 4 11.5 4 C15 4 18 6 20 9 C22 6 25 4 28.5 4 C33 4 37 7.5 37 12.5 C37 19 32 26 20 35Z" fill="#f75b95"/><path d="M13 21 l2-5 2 3 h6 l2-3 2 5 c0 4-3 7-7 7 s-7-3-7-7z" fill="#fffcf7"/><circle cx="17.5" cy="22" r="1" fill="#1f1a1d"/><circle cx="22.5" cy="22" r="1" fill="#1f1a1d"/></svg>
    <div><h1>Cha'Mania</h1><small>Validation d'un post</small></div>
  </header>
  <div id="content"><p class="hint">Chargement du post…</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const CFG = window.CHAMANIA_CONFIG || {};
const URL_ = ((String(CFG.SUPABASE_URL||"").match(/^(https?:\/\/[^\/?#]+)/i)) || [])[1] || "";
const PF = {instagram:"Instagram", facebook:"Facebook"};
const FORMATS = {post:"Post", carrousel:"Carrousel", reel:"Reel / vidéo", story:"Story"};
const JOURS_L=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOIS_L=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
const token = new URLSearchParams(location.search).get("t") || "";
let sb = null, post = null, who = "";
try{ who = localStorage.getItem("chamania-validatrice") || ""; }catch(e){}

function when(p){
  if(!p.date) return "pas encore de date";
  const [y,m,d] = p.date.split("-").map(Number); const dt = new Date(y,m-1,d);
  return `${JOURS_L[dt.getDay()]} ${d} ${MOIS_L[m-1]}${p.time ? " à " + String(p.time).slice(0,5).replace(":","h") : ""}`;
}
const stamp = iso => { const d = new Date(iso); return `${d.getDate()} ${MOIS[d.getMonth()]} à ${d.getHours()}h${String(d.getMinutes()).padStart(2,"0")}`; };
const mediaUrl = m => `${URL_}/storage/v1/object/public/medias/${m.path.split("/").map(encodeURIComponent).join("/")}`;
function fail(msg){ $("#content").innerHTML = `<div class="card"><p class="err" style="margin:0">${esc(msg)}</p></div>`; }

function render(){
  const p = post, media = (p.media||[]).filter(m => m && m.path), appr = Array.isArray(p.approvals) ? p.approvals : [];
  const names = (p.validatrices && p.validatrices.length) ? p.validatrices : ["Sibylle","Gaëlle"];
  let banner = "";
  if(["pret","publie"].includes(p.status)) banner = `<div class="banner ok">✅ Déjà validé${p.validated_name ? " par <b>" + esc(p.validated_name) + "</b>" : ""}. Tu peux quand même donner ton avis.</div>`;
  else if(p.status === "creation" && appr.some(a => !a.ok)) banner = `<div class="banner warn">🔁 Des modifications ont été demandées : la version ci-dessous est peut-être en cours de correction.</div>`;
  $("#content").innerHTML = `
    ${banner}
    <section class="card">
      <h2>${esc(p.title)}</h2>
      <div class="meta"><span>📅 <b>${esc(when(p))}</b></span><span>📍 ${esc((p.platforms||[]).map(k => PF[k]||k).join(" + ") || "réseau à choisir")}</span><span>${esc(FORMATS[p.format] || "Post")}</span></div>
    </section>
    ${media.length ? `<section><div class="gallery" id="gal">${media.map((m,i) => `<figure>${m.type==="video" ? `<video src="${esc(mediaUrl(m))}" controls playsinline preload="metadata"></video>` : `<img src="${esc(mediaUrl(m))}" alt="Visuel ${i+1}">`}</figure>`).join("")}</div>${media.length>1?`<p class="count">${media.length} visuels · fais glisser pour tout voir</p>`:""}</section>` : `<div class="banner warn">Pas encore de visuel sur ce post.</div>`}
    <section class="card"><p class="sec-t">Texte du post</p>${p.caption ? `<div class="caption">${esc(p.caption)}</div>` : `<p class="hint" style="margin:0">Pas encore de texte.</p>`}${p.hashtags ? `<div class="tags">${esc(p.hashtags)}</div>` : ""}</section>
    ${appr.length ? `<section class="card"><p class="sec-t">Avis déjà donnés</p>${appr.map(a => `<div class="appr">${a.ok?"✅":"🔁"} <b>${esc(a.name)}</b> ${a.ok?"a validé":"demande des modifs"}${a.comment ? ` : « ${esc(a.comment)} »` : ""}<small>${esc(stamp(a.at))}</small></div>`).join("")}</section>` : ""}
    <section class="card" id="form">
      <label>Qui es-tu ?</label>
      <div class="who" id="who">${names.map(n => `<button type="button" data-n="${esc(n)}" aria-pressed="${n===who}">${esc(n)}</button>`).join("")}<input id="who-other" placeholder="Autre prénom" value="${names.includes(who) ? "" : esc(who)}" aria-label="Autre prénom"></div>
      <div style="margin-top:14px"><label for="cmt">Un commentaire ? <span class="hint" style="font-weight:400">(obligatoire pour « À revoir »)</span></label><textarea id="cmt" placeholder="Ex. super ! / changer la 2e photo / ajouter le lien de la cagnotte…"></textarea></div>
      <p class="err" id="err" hidden></p>
      <div class="actions" style="margin-top:12px"><button class="btn ok" type="button" id="ok">✅ Je valide</button><button class="btn ko" type="button" id="ko">✏️ À revoir</button></div>
    </section>`;
  document.querySelectorAll("#who [data-n]").forEach(b => b.onclick = () => { who = b.dataset.n; $("#who-other").value = ""; document.querySelectorAll("#who [data-n]").forEach(x => x.setAttribute("aria-pressed", x===b)); });
  $("#who-other").oninput = e => { who = e.target.value.trim(); document.querySelectorAll("#who [data-n]").forEach(x => x.setAttribute("aria-pressed", "false")); };
  $("#ok").onclick = () => submit(true);
  $("#ko").onclick = () => submit(false);
}

async function submit(ok){
  const err = $("#err"); err.hidden = true;
  const comment = $("#cmt").value.trim();
  if(!who){ err.textContent = "Touche ton prénom (ou écris-le) pour qu'on sache qui a répondu."; err.hidden = false; return; }
  if(!ok && !comment){ err.textContent = "Explique en quelques mots ce qu'il faut revoir."; err.hidden = false; $("#cmt").focus(); return; }
  $("#ok").disabled = $("#ko").disabled = true;
  try{ localStorage.setItem("chamania-validatrice", who); }catch(e){}
  const {data, error} = await sb.rpc("submit_validation", {p_token: token, p_name: who, p_ok: ok, p_comment: comment});
  if(error){ err.textContent = "L'envoi n'a pas marché : " + error.message; err.hidden = false; $("#ok").disabled = $("#ko").disabled = false; return; }
  $("#content").innerHTML = `<div class="card done"><div class="big">${ok ? "🎉" : "📝"}</div><h2>${ok ? "Merci " + esc(who) + " !" : "C'est noté, merci " + esc(who) + " !"}</h2>
    <p>${ok ? "Le post est validé : l'équipe est prévenue et peut le publier." : "L'équipe est prévenue et va faire les modifications. Tu recevras un nouveau lien si besoin."}</p>
    <p class="hint">Tu peux fermer cette page.</p></div>`;
}

(async () => {
  if(!token){ fail("Ce lien est incomplet. Demande à l'équipe de te renvoyer le lien de validation."); return; }
  if(!window.supabase || !URL_){ fail("La page n'a pas pu se charger. Vérifie ta connexion et réessaie."); return; }
  sb = window.supabase.createClient(URL_, String(CFG.SUPABASE_KEY||"").trim(), {auth:{persistSession:false, autoRefreshToken:false}});
  const {data, error} = await sb.rpc("get_validation", {p_token: token});
  if(error){ fail("Impossible de charger le post : " + error.message); return; }
  if(!data){ fail("Ce lien de validation n'existe plus (le post a peut-être été supprimé)."); return; }
  post = data; document.title = "Valider : " + post.title + " · Cha'Mania"; render();
})();
</script>
</body>
</html>
